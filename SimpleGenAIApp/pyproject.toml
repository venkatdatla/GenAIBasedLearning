[project]
name = "simple-genai-app"
version = "0.1.0"
description = "Beginner chat examples for Microsoft Foundry, OpenAI SDK, LangChain, and LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework>=1.0.0b1",
    "agent-framework-foundry>=1.0.0b1",
    "agent-framework-openai>=1.0.0b1",
    "azure-identity>=1.17.0",
    "python-dotenv>=1.0.1",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "openai>=2.0.0",
]

[tool.uv]
package = false
